<style>
:root{
  --bg:#f4eee2;
  --paper:#fffdf8;
  --gold:#b08a43;
  --ink:#332923;
  --line:rgba(176,138,67,.30);
  --shadow:0 18px 45px rgba(58,43,28,.14);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  min-height:100dvh;

  padding:
    max(12px,env(safe-area-inset-top))
    max(10px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:var(--ink);
  font-family:Cairo,sans-serif;
  overflow-x:hidden;
}

.wrapper{
  width:min(94vw,420px);
  margin-bottom:14px;
}

.viewer{
  position:relative;
  width:100%;
  border-radius:16px;
  overflow:hidden;
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.invitation-img{
  width:100%;
  height:auto;
  display:block;
}

.actions{
  width:min(94vw,420px);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.action{
  width:100%;
  min-height:48px;
  padding:10px 14px;

  border:1.5px solid var(--gold);
  border-radius:12px;

  background:#fff;
  color:var(--ink);

  font:700 15px Cairo,sans-serif;

  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  cursor:pointer;

  box-shadow:0 3px 8px rgba(0,0,0,.06);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background-color .2s ease,
    border-color .2s ease;
}

.action.primary{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  box-shadow:0 4px 12px rgba(176,138,67,.35);
}

.action:active{
  transform:scale(.98);
}

.action:focus-visible{
  outline:3px solid rgba(176,138,67,.45);
  outline-offset:3px;
}

@media(hover:hover){
  .action:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.10);
  }

  .action.primary:hover{
    box-shadow:0 8px 20px rgba(176,138,67,.40);
  }
}

.toast{
  position:fixed;
  left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));

  z-index:20;

  width:min(92vw,420px);
  max-width:420px;

  padding:10px 15px;

  border-radius:14px;

  background:rgba(51,41,35,.96);
  color:#fff;

  font-size:12px;
  font-weight:600;
  line-height:1.8;
  text-align:center;

  opacity:0;
  pointer-events:none;

  transform:translate(-50%,15px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:390px){
  body{
    padding-top:7px;
  }
}

@media(prefers-reduced-motion:reduce){
  .action,
  .toast{
    transition:none;
  }
}
</style>

</head>

<body>

<main class="wrapper" aria-label="دعوة زواج">

  <div class="viewer">
    <img
      class="invitation-img"
      src="invitation.png"
      alt="دعوة زواج محمد المصطفى (منا) وسارة"
      fetchpriority="high"
      decoding="async"
    >
  </div>

</main>

<nav class="actions" aria-label="خيارات الدعوة">

  <a
    class="action primary"
    href="https://maps.app.goo.gl/uX7G7L8T3E7V"
    target="_blank"
    rel="noopener noreferrer"
  >
    موقع الصالة
  </a>

  <button
    class="action"
    type="button"
    id="shareButton"
  >
    أرسل الدعوة لزول تاني
  </button>

  <button
    class="action"
    type="button"
    id="salawatButton"
  >
    صلِّ على النبي ﷺ
  </button>

</nav>

<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>

<script>
const SITE_URL = 'https://mohammed-sarah.vercel.app/';

const toast = document.getElementById('toast');
const shareButton = document.getElementById('shareButton');
const salawatButton = document.getElementById('salawatButton');

let toastTimer;

function toastMsg(message){
  clearTimeout(toastTimer);

  toast.textContent = message;
  toast.classList.add('show');

  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2700);
}

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
    return true;
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';

  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();

  const success = document.execCommand('copy');
  textarea.remove();

  if(!success){
    throw new Error('Copy failed');
  }

  return true;
}

shareButton.addEventListener(
  'click',
  async () => {
    if(navigator.share){
      try{
        // إرسال الرابط فقط يسمح للواتساب والمنصات بقراءة الـ Open Graph وإظهار الكارت الأنيق
        await navigator.share({
          url: SITE_URL
        });
        return;
      }
      catch(error){
        if(error.name === 'AbortError'){
          return;
        }
      }
    }

    try{
      await copyText(SITE_URL);
      toastMsg('تم نسخ رابط الدعوة');
    }
    catch(error){
      toastMsg('تعذر نسخ الرابط');
    }
  }
);

salawatButton.addEventListener(
  'click',
  async () => {
    const text = 'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ';

    try{
      await copyText(text);
    }
    catch(error){}

    toastMsg(text);
  }
);
</script>

</body>

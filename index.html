<style>
:root{--bg:#f4eee2;--paper:#fffdf8;--gold:#b08a43;--gold2:#d9c18f;--ink:#332923;--muted:#756b61;--line:rgba(176,138,67,.30);--shadow:0 18px 45px rgba(58,43,28,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{min-height:100vh;padding:12px 10px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:Cairo,sans-serif;overflow-x:hidden}

.wrapper{width:min(94vw,410px);margin-bottom:12px}
.viewer{position:relative;width:100%;aspect-ratio:642/1013;border-radius:16px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.invitation-img{width:100%;height:100%;display:block;object-fit:contain;background:var(--paper)}

.actions{width:min(94vw,410px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.action{min-height:46px;padding:8px 6px;border:1.5px solid var(--gold);border-radius:12px;background:#ffffff;color:#332923;font:700 11.5px Cairo,sans-serif;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.06);transition:all .2s ease}
.action.primary{background:var(--gold);border-color:var(--gold);color:#ffffff;box-shadow:0 4px 12px rgba(176,138,67,.35)}
.action:active{transform:scale(.96)}

.toast{position:fixed;left:50%;bottom:20px;z-index:20;max-width:calc(100vw - 24px);padding:9px 15px;border-radius:999px;background:rgba(51,41,35,.96);color:#fff;font-size:11px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,15px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){body{padding-top:7px}}
@media(max-height:700px){body{justify-content:flex-start}.wrapper{width:min(76vh,390px,94vw)}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<main class="wrapper" aria-label="دعوة زواج">
  <div class="viewer">
    <img class="invitation-img" src="invitation.png" alt="دعوة زواج محمد المصطفى (منا) وسارة" loading="eager" decoding="async">
  </div>
</main>

<nav class="actions" aria-label="خيارات الدعوة">
  <a class="action primary" href="https://www.google.com/maps/search/?api=1&query=قاعة+جولدن+هولز+نادي+السكة+مدينة+نصر" target="_blank" rel="noopener noreferrer">موقع الصالة</a>
  <button class="action" type="button" id="shareButton">رسل الدعوة لزول تاني</button>
  <button class="action" type="button" id="salawatButton">صلِّ على النبي ﷺ</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SITE_URL='https://mohammed-sarah.vercel.app/';
const toast=document.getElementById('toast');
let toastTimer;

function toastMsg(t){
  clearTimeout(toastTimer);
  toast.textContent=t;
  toast.classList.add('show');
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2700);
}

document.getElementById('shareButton').onclick=async()=>{
  const data={
    title:'دعوة زواج | محمد المصطفى (منا) وسارة',
    text:'نتشرف بدعوتكم لحضور عقد قران وحفل زفاف محمد المصطفى (منا) وسارة\nالأربعاء 16 سبتمبر 2026م\nقاعة جولدن هولز - نادي السكة - مدينة نصر',
    url:SITE_URL
  };
  if(navigator.share){
    try{await navigator.share(data)}catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(SITE_URL);
      toastMsg('تم نسخ رابط الدعوة');
    }catch(e){
      toastMsg(SITE_URL);
    }
  }
};

document.getElementById('salawatButton').onclick=async()=>{
  const t='اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ';
  try{await navigator.clipboard.writeText(t)}catch(e){}
  toastMsg(t);
};
</script>
</body>

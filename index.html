<style>

:root{
  --bg:#f4eee2;
  --paper:#fffdf8;

  --gold:#b08a43;
  --gold-hover:#967332;
  --gold-soft:rgba(176,138,67,.16);
  --gold-line:rgba(176,138,67,.34);

  --ink:#332923;
  --muted:#786c62;

  --shadow:0 18px 45px rgba(58,43,28,.14);
  --button-shadow:0 5px 16px rgba(58,43,28,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:var(--bg);
}

body{

  min-height:100vh;
  min-height:100dvh;

  padding:
    max(16px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:var(--ink);

  font-family:'Cairo',sans-serif;

  overflow-x:hidden;
}


/* =========================
   Invitation
   ========================= */

.wrapper{

  width:min(94vw,420px);

  margin-bottom:18px;
}

.viewer{

  position:relative;

  width:100%;

  border-radius:20px;

  overflow:hidden;

  background:var(--paper);

  border:1px solid var(--gold-line);

  box-shadow:var(--shadow);
}

.invitation-img{

  width:100%;

  height:auto;

  display:block;
}


/* =========================
   Action Buttons
   ========================= */

.actions{

  width:min(94vw,420px);

  display:flex;

  flex-direction:column;

  gap:10px;
}

.action{

  position:relative;

  width:100%;

  min-height:50px;

  padding:10px 16px;

  border:1px solid var(--gold-line);

  border-radius:16px;

  background:rgba(255,253,248,.94);

  color:var(--ink);

  font:600 14px 'Cairo',sans-serif;

  text-decoration:none;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  cursor:pointer;

  box-shadow:var(--button-shadow);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease;

  gap:9px;

  -webkit-tap-highlight-color:transparent;
}

.action-icon{

  width:19px;

  height:19px;

  flex:0 0 19px;

  stroke:currentColor;

  stroke-width:1.8;

  fill:none;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* Main Location Button */

.action.primary{

  min-height:52px;

  background:linear-gradient(
    135deg,
    #b99650 0%,
    #aa8240 100%
  );

  border-color:#a77f3d;

  color:#fffdf8;

  box-shadow:
    0 7px 20px rgba(176,138,67,.25),
    inset 0 1px 0 rgba(255,255,255,.20);

  font-size:15px;

  font-weight:700;
}


/* Secondary Buttons */

.btn-group{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  width:100%;
}

.btn-group .action{

  min-height:48px;

  padding-left:10px;

  padding-right:10px;

  font-size:13px;
}


/* Salawat */

.action.salawat{

  min-height:46px;

  margin-top:1px;

  background:transparent;

  border-color:rgba(176,138,67,.22);

  color:var(--gold);

  box-shadow:none;

  font-size:13px;

  font-weight:600;

  letter-spacing:.1px;
}

.action.salawat .action-icon{

  width:17px;

  height:17px;
}


/* =========================
   Interaction
   ========================= */

.action:active{

  transform:scale(.975);

  box-shadow:
    0 2px 7px rgba(58,43,28,.08);
}

.action.primary:active{

  transform:scale(.975);

  box-shadow:
    0 3px 10px rgba(176,138,67,.22);
}

.action:focus-visible{

  outline:3px solid rgba(176,138,67,.28);

  outline-offset:3px;
}


@media(hover:hover){

  .action:hover{

    transform:translateY(-2px);

    background:#fffaf0;

    border-color:rgba(176,138,67,.50);

    box-shadow:
      0 8px 22px rgba(58,43,28,.10);
  }

  .action.primary:hover{

    background:linear-gradient(
      135deg,
      #c09b54 0%,
      var(--gold-hover) 100%
    );

    border-color:var(--gold-hover);

    color:#fff;
  }

  .action.salawat:hover{

    background:rgba(176,138,67,.055);

    border-color:rgba(176,138,67,.32);

    color:var(--gold-hover);

    box-shadow:none;
  }
}


/* =========================
   Calendar Modal
   ========================= */

.modal-overlay{

  position:fixed;

  inset:0;

  background:rgba(38,29,23,.46);

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  z-index:100;

  opacity:0;

  pointer-events:none;

  transition:opacity .25s ease;
}

.modal-overlay.show{

  opacity:1;

  pointer-events:auto;
}

.modal-card{

  width:min(88vw,360px);

  background:var(--paper);

  border:1px solid var(--gold-line);

  border-radius:20px;

  padding:22px 17px 17px;

  box-shadow:
    0 24px 55px rgba(0,0,0,.22);

  text-align:center;

  transform:translateY(8px) scale(.94);

  transition:transform .25s ease;
}

.modal-overlay.show .modal-card{

  transform:translateY(0) scale(1);
}

.modal-title{

  position:relative;

  font-size:16px;

  font-weight:700;

  color:var(--ink);

  margin-bottom:17px;

  padding-bottom:12px;
}

.modal-title::after{

  content:"";

  position:absolute;

  bottom:0;

  right:50%;

  width:42px;

  height:1px;

  background:var(--gold);

  transform:translateX(50%);

  opacity:.65;
}

.modal-actions{

  display:flex;

  flex-direction:column;

  gap:9px;
}

.modal-actions .action{

  min-height:48px;

  font-size:13px;
}

.modal-close{

  margin-top:12px;

  padding:6px 14px;

  background:transparent;

  border:none;

  color:var(--muted);

  font-family:'Cairo',sans-serif;

  font-size:13px;

  font-weight:600;

  cursor:pointer;

  border-radius:10px;

  transition:
    color .18s ease,
    background-color .18s ease;
}

.modal-close:hover{

  color:var(--ink);

  background:rgba(176,138,67,.07);
}


/* =========================
   Toast
   ========================= */

.toast{

  position:fixed;

  left:50%;

  bottom:max(20px,env(safe-area-inset-bottom));

  z-index:120;

  width:min(92vw,420px);

  max-width:420px;

  padding:10px 15px;

  border-radius:14px;

  background:rgba(51,41,35,.96);

  color:#fff;

  font-size:12px;

  font-weight:600;

  line-height:1.8;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transform:translate(-50%,15px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{

  opacity:1;

  transform:translate(-50%,0);
}


/* =========================
   Small Screens
   ========================= */

@media(max-width:390px){

  body{

    padding-top:10px;
  }

  .wrapper{

    width:min(94vw,400px);

    margin-bottom:15px;
  }

  .actions{

    width:min(94vw,400px);

    gap:9px;
  }

  .action{

    min-height:48px;

    border-radius:15px;
  }

  .action.primary{

    min-height:50px;
  }

  .btn-group{

    gap:9px;
  }

  .btn-group .action{

    min-height:47px;

    font-size:12.5px;
  }

  .action-icon{

    width:18px;

    height:18px;
  }
}


/* =========================
   Reduced Motion
   ========================= */

@media(prefers-reduced-motion:reduce){

  .action,
  .toast,
  .modal-overlay,
  .modal-card,
  .modal-close{

    transition:none;
  }
}

</style>

</head>

<script>


/* =========================
   Site
   ========================= */

const SITE_URL =
  'https://mohammed-sarah.vercel.app/';


/* =========================
   DOM
   ========================= */

const toast =
  document.getElementById('toast');

const shareButton =
  document.getElementById('shareButton');

const salawatButton =
  document.getElementById('salawatButton');

const calendarButton =
  document.getElementById('calendarButton');

const calendarModal =
  document.getElementById('calendarModal');

const closeModal =
  document.getElementById('closeModal');

const gCalLink =
  document.getElementById('gCalLink');

const icsLink =
  document.getElementById('icsLink');


let toastTimer;


/* =========================
   Toast
   ========================= */

function toastMsg(message){

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.classList.add('show');

  toastTimer =
    setTimeout(() => {

      toast.classList.remove('show');

    },2700);
}


/* =========================
   Copy
   ========================= */

async function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(text);

    return true;
  }


  const textarea =
    document.createElement('textarea');


  textarea.value = text;

  textarea.style.position = 'fixed';

  textarea.style.left = '-9999px';


  document.body.appendChild(textarea);


  textarea.focus();

  textarea.select();


  const success =
    document.execCommand('copy');


  textarea.remove();


  if(!success){

    throw new Error('Copy failed');

  }


  return true;
}


/* =========================
   Central Event Data
   ========================= */

const EVENT_DATA = {

  title:
    "حفل زفاف محمد المصطفى (منا) وسارة - Capital Palace Hall",

  details:
    "نتشرف بدعوتكم لحضور عقد قران وحفل زفاف محمد المصطفى (منا) وسارة - Capital Palace Hall، شارع الفردوس، نادي السكة الحديد، مدينة نصر، القاهرة.",

  location:
    "Capital Palace Hall، شارع الفردوس، نادي السكة الحديد، مدينة نصر، القاهرة",

  mapsUrl:
    "https://www.google.com/maps/place/Capital+palace+hall/@30.0544522,31.3037216,17z/data=!3m1!4b1!4m6!3m5!1s0x14583f00331f6c67:0xa1fd5bbeebd54958!8m2!3d30.0544522!4d31.3037216!16s%2Fg%2F11vtbqgj8h!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDkxMy4wIKXMDSoASAFQAw%3D%3D",

  dateText:
    "الأربعاء 16 سبتمبر 2026م",

  // Kept exactly as in the previous version.
  // 16 September 2026: Egypt daylight saving time (GMT+3)
  // Start: 19:00 local = 16:00 UTC
  // End: 23:00 local = 20:00 UTC

  startUtc:
    "20260916T160000Z",

  endUtc:
    "20260916T200000Z"

};


/* =========================
   Calendar
   ========================= */

calendarButton.addEventListener(
  'click',
  () => {


    const gCalUrl =

      `https://calendar.google.com/calendar/render?action=TEMPLATE` +

      `&text=${encodeURIComponent(EVENT_DATA.title)}` +

      `&dates=${EVENT_DATA.startUtc}/${EVENT_DATA.endUtc}` +

      `&details=${encodeURIComponent(EVENT_DATA.details)}` +

      `&location=${encodeURIComponent(EVENT_DATA.location)}`;


    gCalLink.href =
      gCalUrl;


    calendarModal.classList.add('show');


    calendarModal.setAttribute(
      'aria-hidden',
      'false'
    );

  }
);


/* =========================
   Close Calendar Modal
   ========================= */

closeModal.addEventListener(
  'click',
  () => {

    calendarModal.classList.remove('show');

    calendarModal.setAttribute(
      'aria-hidden',
      'true'
    );

  }
);


calendarModal.addEventListener(
  'click',
  (e) => {

    if(e.target === calendarModal){

      calendarModal.classList.remove('show');

      calendarModal.setAttribute(
        'aria-hidden',
        'true'
      );

    }

  }
);


/* =========================
   ICS Download
   ========================= */

icsLink.addEventListener(
  'click',
  () => {


    const icsData =

`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Wedding Invitation//AR
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
SUMMARY:${EVENT_DATA.title}
DESCRIPTION:${EVENT_DATA.details}
LOCATION:${EVENT_DATA.location}
DTSTART:${EVENT_DATA.startUtc}
DTEND:${EVENT_DATA.endUtc}
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;


    const blob =
      new Blob(
        [icsData],
        {
          type:
            'text/calendar;charset=utf-8'
        }
      );


    const link =
      document.createElement('a');


    link.href =
      window.URL.createObjectURL(blob);


    link.setAttribute(
      'download',
      'دعوة-زواج-محمد-وسارة.ics'
    );


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    window.URL.revokeObjectURL(link.href);


    calendarModal.classList.remove('show');

    calendarModal.setAttribute(
      'aria-hidden',
      'true'
    );


    toastMsg(
      'تم تنزيل ملف التقويم'
    );

  }
);


/* =========================
   Share Invitation
   ========================= */

shareButton.addEventListener(
  'click',
  async () => {


    /*
      Share the invitation with:
      - title
      - event description
      - invitation URL
    */

    if(navigator.share){

      try{

        await navigator.share({

          title:
            "دعوة زواج محمد المصطفى (منا) وسارة",

          text:
            `${EVENT_DATA.dateText}\n${EVENT_DATA.location}`,

          url:
            SITE_URL

        });


        return;

      }catch(error){

        if(
          error.name ===
          'AbortError'
        ){

          return;

        }

      }

    }


    /*
      Fallback:
      copy the invitation URL.
    */

    try{

      await copyText(SITE_URL);

      toastMsg(
        'تم نسخ رابط الدعوة'
      );

    }catch(error){

      toastMsg(
        'تعذر نسخ الرابط'
      );

    }

  }
);


/* =========================
   Salawat
   ========================= */

salawatButton.addEventListener(
  'click',
  async () => {


    const text =
      'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ';


    try{

      await copyText(text);

    }catch(error){}


    toastMsg(text);

  }
);


/* =========================
   Escape closes modal
   ========================= */

document.addEventListener(
  'keydown',
  (e) => {


    if(
      e.key === 'Escape' &&
      calendarModal.classList.contains('show')
    ){

      calendarModal.classList.remove('show');

      calendarModal.setAttribute(
        'aria-hidden',
        'true'
      );

    }

  }
);

</script>

<style>

:root{

  --bg:#f4eee2;
  --paper:#fffdf8;

  --ink:#332923;

*{

  padding:0;

}



html,
body{

  min-height:100%;

}



body{

  min-height:100vh;

.wrapper{

  width:min(94vw,420px);
  margin-bottom:14px;

}



.viewer{

  position:relative;
  width:100%;

  border-radius:16px;
  overflow:hidden;

  background:var(--paper);

  border:1px solid var(--line);

  box-shadow:var(--shadow);

}



.invitation-img{

  width:100%;
  height:auto;
  display:block;

.actions{

  width:min(94vw,420px);

  display:flex;
  flex-direction:column;
  gap:10px;

.action{

  width:100%;
  min-height:48px;

  padding:10px 14px;

  border:1.5px solid var(--gold);
  border-radius:12px;

  background:#fff;
  color:var(--ink);

  font:700 15px Cairo,sans-serif;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  touch-action:manipulation;

  box-shadow:0 3px 8px rgba(0,0,0,.06);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background-color .2s ease,
    border-color .2s ease;

}



.action.primary{

  background:var(--gold);
  border-color:var(--gold);
  color:#fff;

  box-shadow:0 4px 12px rgba(176,138,67,.35);

}



.action:active{

  transform:scale(.98);

}



.action:focus-visible{

  outline:3px solid rgba(176,138,67,.45);
  outline-offset:3px;

}



.action:disabled{

  opacity:.65;
  cursor:default;

}



@media(hover:hover){

  .action:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 18px rgba(0,0,0,.10);

  }



  .action.primary:hover{

    box-shadow:0 8px 20px rgba(176,138,67,.40);

  }

}



.toast{

  position:fixed;

  left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));

  z-index:20;

  width:min(92vw,420px);
  max-width:420px;

  padding:10px 15px;

  border-radius:14px;

  font-size:12px;

  opacity:0;
  pointer-events:none;

  transform:translate(-50%,15px);

  transition:

}



.toast.show{

  opacity:1;
  transform:translate(-50%,0);

}

<nav class="actions" aria-label="خيارات الدعوة">



  <!-- =====================================================

    href="https://www.google.com/maps/search/?api=1&query=جولدن+هولز-+GOLDEN+HALLS،+بوابة+رقم+1،+نادي+السكة+الحديد،+مدينة+نصر،+محافظة+القاهرة+4433017&query_place_id=ChIJNwgDIjs_WBQR83So0t4vbTI"

    target="_blank"

<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>



<script>

/* =========================================================
   الإعدادات الأساسية
   ========================================================= */



const SITE_URL = 'https://mohammed-sarah.vercel.app/';



const SHARE_TITLE =
  'دعوة زواج | محمد المصطفى (منا) وسارة';



const VENUE =
  'جولدن هولز - GOLDEN HALLS، بوابة رقم 1، نادي السكة الحديد، مدينة نصر، محافظة القاهرة 4433017';



const SHARE_TEXT =

  'نتشرف بدعوتكم لحضور عقد قران وحفل زفاف محمد المصطفى (منا) وسارة\n' +

  'الأربعاء 16 سبتمبر 2026م\n' +

  'من الساعة 9 مساءً حتى 12 صباحًا\n' +

  VENUE +

  '\n\n' +

  'رابط الدعوة:\n' +

  SITE_URL;



/* =========================================================
   عناصر الصفحة
   ========================================================= */



const toast =
  document.getElementById('toast');



const shareButton =
  document.getElementById('shareButton');



const calendarButton =
  document.getElementById('calendarButton');



const salawatButton =
  document.getElementById('salawatButton');



let toastTimer;



/* =========================================================
   Toast
   ========================================================= */



function toastMsg(message){

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.classList.add('show');

  toastTimer = setTimeout(() => {

    toast.classList.remove('show');

  }, 2700);

}



/* =========================================================
   نسخ النص
   ========================================================= */



async function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(text);

    return true;

  }



  const textarea =
    document.createElement('textarea');



  textarea.value = text;

  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  textarea.style.top = '0';
  textarea.style.opacity = '0';



  document.body.appendChild(textarea);



  textarea.focus();
  textarea.select();



  const success =
    document.execCommand('copy');



  textarea.remove();



  if(!success){

    throw new Error('Copy failed');

  }



  return true;

}



/* =========================================================
   مشاركة الدعوة
   ========================================================= */



shareButton.addEventListener(

  'click',

  async () => {

    if(shareButton.disabled){

      return;

    }



    shareButton.disabled = true;



    const data = {

      title: SHARE_TITLE,

      text: SHARE_TEXT,

      url: SITE_URL

    };



    let shared = false;



    /* -----------------------------------------------------
       1. المشاركة الأصلية في الهاتف
       ----------------------------------------------------- */

    if(navigator.share){

      try{

        await navigator.share(data);

        shared = true;

      }

      catch(error){

        if(error.name === 'AbortError'){

          shareButton.disabled = false;

          return;

        }

      }

    }



    if(!shared){

      /* ---------------------------------------------------
         2. فتح واتساب مباشرة كحل احتياطي
         --------------------------------------------------- */

      try{

        const whatsappUrl =

          'https://wa.me/?text=' +

          encodeURIComponent(SHARE_TEXT);



        window.open(

          whatsappUrl,

          '_blank',

          'noopener,noreferrer'

        );



        shared = true;

      }

      catch(error){

        shared = false;

      }

    }



    if(!shared){

      /* ---------------------------------------------------
         3. الاحتياطي الأخير: نسخ الرابط
         --------------------------------------------------- */

      try{

        await copyText(SITE_URL);

        toastMsg('تم نسخ رابط الدعوة');

      }

      catch(error){

        toastMsg(
          'تعذر إرسال الدعوة أو نسخ الرابط'
        );

      }

    }



    setTimeout(() => {

      shareButton.disabled = false;

    }, 700);

  }

);



/* =========================================================
   إضافة الموعد إلى التقويم
   ========================================================= */



calendarButton.addEventListener(

  'click',

  () => {



    /*

      التاريخ:

      الأربعاء 16 سبتمبر 2026



      بداية الحفل:

      9:00 مساءً



      نهاية الحفل:

      12:00 صباحًا

      أي بداية الخميس 17 سبتمبر 2026



      صيغة ICS تستخدم وقتًا محليًا عائمًا

      حتى لا يحدث تحويل غير مرغوب فيه بين

      المناطق الزمنية.

    */



    const icsContent =

      'BEGIN:VCALENDAR\r\n' +

      'VERSION:2.0\r\n' +

      'PRODID:-//Mohammed Sarah Wedding//AR\r\n' +

      'CALSCALE:GREGORIAN\r\n' +

      'METHOD:PUBLISH\r\n' +

      'BEGIN:VEVENT\r\n' +

      'UID:mohammed-sarah-wedding-20260916@mohammed-sarah.vercel.app\r\n' +

      'DTSTAMP:20260902T004500Z\r\n' +

      'DTSTART:20260916T210000\r\n' +

      'DTEND:20260917T000000\r\n' +

      'SUMMARY:عقد قران وحفل زفاف محمد المصطفى (منا) وسارة\r\n' +

      'LOCATION:' + VENUE + '\r\n' +

      'DESCRIPTION:نتشرف بدعوتكم لحضور عقد قران وحفل زفاف محمد المصطفى (منا) وسارة\\nالأربعاء 16 سبتمبر 2026م\\nمن الساعة 9 مساءً حتى 12 صباحًا\\n' +

      VENUE +

      '\\n' +

      'رابط الدعوة: ' +

      SITE_URL +

      '\r\n' +

      'URL:' +

      SITE_URL +

      '\r\n' +

      'END:VEVENT\r\n' +

      'END:VCALENDAR\r\n';



    const blob = new Blob(

      [icsContent],

      {

        type:'text/calendar;charset=utf-8'

      }

    );



    const url =
      URL.createObjectURL(blob);



    const link =
      document.createElement('a');



    link.href = url;

    link.download =
      'دعوة-زواج-محمد-وسارة.ics';



    document.body.appendChild(link);

    link.click();

    link.remove();



    setTimeout(() => {

      URL.revokeObjectURL(url);

    }, 1000);



    toastMsg(
      'تم تجهيز موعد الدعوة للتقويم'
    );

  }

);



/* =========================================================
   الصلاة على النبي ﷺ
   ========================================================= */



salawatButton.addEventListener(

  'click',

  async () => {

    const text =
      'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ';



    try{

      await copyText(text);

    }

    catch(error){

      /* لا نوقف إظهار الرسالة إذا فشل النسخ */

    }



    toastMsg(text);

  }

);

</script>

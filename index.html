<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>دعوة زواج | محمد المصطفى (منا) وسارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4eee2;
  --paper:#fffdf8;
  --gold:#b08a43;
  --gold-dark:#967332;
  --ink:#332923;
  --line:rgba(176,138,67,.30);
  --shadow:0 18px 45px rgba(58,43,28,.14);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  min-height:100dvh;

  padding:
    max(16px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:var(--ink);
  font-family:'Cairo',sans-serif;
  overflow-x:hidden;
}


/* =========================
   الدعوة
========================= */

.wrapper{
  width:min(94vw,420px);
  margin-bottom:18px;
}

.viewer{
  position:relative;
  width:100%;

  border-radius:18px;
  overflow:hidden;

  background:var(--paper);
  border:1px solid var(--line);

  box-shadow:var(--shadow);
}

.invitation-img{
  width:100%;
  height:auto;
  display:block;
}


/* =========================
   الأزرار
========================= */

.actions{
  width:min(94vw,420px);

  display:flex;
  flex-direction:column;

  gap:10px;
}

.btn-group{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  width:100%;
}


/* تصميم الأزرار */

.action{
  position:relative;

  width:100%;
  min-height:50px;

  padding:10px 14px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(255,253,248,.96);

  color:var(--ink);

  font:700 14px 'Cairo',sans-serif;

  text-decoration:none;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  box-shadow:
    0 3px 10px rgba(58,43,28,.06);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background-color .18s ease,
    border-color .18s ease;
}


/* لمسة داخلية بسيطة */

.action::after{
  content:"";

  position:absolute;

  inset:3px;

  border-radius:10px;

  border:1px solid rgba(176,138,67,.08);

  pointer-events:none;
}


/* الزر الرئيسي */

.action.primary{
  background:var(--gold);

  border-color:var(--gold);

  color:#fff;

  box-shadow:
    0 5px 15px rgba(176,138,67,.24);

  font-size:15px;
}


/* الضغط */

.action:active{
  transform:scale(.975);

  box-shadow:
    0 2px 6px rgba(58,43,28,.08);
}


/* التركيز */

.action:focus-visible{
  outline:2px solid rgba(176,138,67,.45);

  outline-offset:3px;
}


/* تأثير الكمبيوتر */

@media(hover:hover){

  .action:hover{
    transform:translateY(-1px);

    background:#fffaf0;

    border-color:rgba(176,138,67,.50);

    box-shadow:
      0 6px 15px rgba(58,43,28,.09);
  }

  .action.primary:hover{
    background:var(--gold-dark);

    border-color:var(--gold-dark);

    box-shadow:
      0 7px 18px rgba(176,138,67,.28);
  }
}


/* =========================
   نافذة خيارات التقويم
========================= */

.modal-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  backdrop-filter:blur(3px);

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:100;

  opacity:0;

  pointer-events:none;

  transition:opacity .25s ease;
}

.modal-overlay.show{
  opacity:1;

  pointer-events:auto;
}

.modal-card{
  width:min(88vw,360px);

  background:var(--paper);

  border:1px solid var(--line);

  border-radius:18px;

  padding:20px 16px;

  box-shadow:
    0 20px 40px rgba(0,0,0,.20);

  text-align:center;

  transform:scale(.92);

  transition:transform .25s ease;
}

.modal-overlay.show .modal-card{
  transform:scale(1);
}

.modal-title{
  font-size:16px;

  font-weight:700;

  color:var(--ink);

  margin-bottom:14px;
}

.modal-actions{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.modal-close{
  margin-top:10px;

  background:transparent;

  border:none;

  color:#888;

  font-family:'Cairo',sans-serif;

  font-size:13px;

  font-weight:600;

  cursor:pointer;
}


/* =========================
   رسالة التنبيه
========================= */

.toast{
  position:fixed;

  left:50%;

  bottom:max(20px,env(safe-area-inset-bottom));

  z-index:120;

  width:min(92vw,420px);

  max-width:420px;

  padding:10px 15px;

  border-radius:14px;

  background:rgba(51,41,35,.96);

  color:#fff;

  font-size:12px;

  font-weight:600;

  line-height:1.8;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transform:translate(-50%,15px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{
  opacity:1;

  transform:translate(-50%,0);
}


/* =========================
   الشاشات الصغيرة
========================= */

@media(max-width:390px){

  body{
    padding-top:10px;
  }

  .btn-group{
    grid-template-columns:1fr;
  }

  .action{
    min-height:48px;
  }
}


/* =========================
   تقليل الحركة
========================= */

@media(prefers-reduced-motion:reduce){

  .action,
  .toast,
  .modal-overlay,
  .modal-card{
    transition:none;
  }
}
</style>
</head>


<body>

<main class="wrapper" aria-label="دعوة زواج">

  <div class="viewer">

    <img
      class="invitation-img"
      src="invitation.png"
      alt="دعوة زواج محمد المصطفى (منا) وسارة"
      fetchpriority="high"
      decoding="async"
    >

  </div>

</main>


<nav class="actions" aria-label="خيارات الدعوة">


  <!-- الموقع الصحيح للصالة -->

  <a
    class="action primary"
    href="https://maps.app.goo.gl/7jRHT8HtYSfQLDGg6"
    target="_blank"
    rel="noopener noreferrer"
  >
    📍 موقع الصالة
  </a>


  <!-- أزرار إضافية -->

  <div class="btn-group">

    <button
      class="action"
      type="button"
      id="calendarButton"
    >
      📅 إضافة للتقويم
    </button>


    <button
      class="action"
      type="button"
      id="shareButton"
    >
      🔗 أرسل الدعوة
    </button>

  </div>


  <!-- الصلاة على النبي -->

  <button
    class="action"
    type="button"
    id="salawatButton"
  >
    ✨ صلِّ على النبي ﷺ
  </button>

</nav>


<!-- =========================
     نافذة خيارات التقويم
========================= -->

<div
  class="modal-overlay"
  id="calendarModal"
  aria-hidden="true"
>

  <div class="modal-card">

    <div class="modal-title">
      اختر تطبيق التقويم الخاص بك
    </div>


    <div class="modal-actions">

      <a
        class="action"
        id="gCalLink"
        target="_blank"
        rel="noopener noreferrer"
      >
        تقويم قوقل (Google Calendar)
      </a>


      <button
        class="action"
        type="button"
        id="icsLink"
      >
        تنزيل ملف التقويم (.ics / آبل)
      </button>

    </div>


    <button
      class="modal-close"
      type="button"
      id="closeModal"
    >
      إلغاء
    </button>

  </div>

</div>


<!-- رسالة التنبيه -->

<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>


<script>

const SITE_URL =
  'https://mohammed-sarah.vercel.app/';


const toast =
  document.getElementById('toast');

const shareButton =
  document.getElementById('shareButton');

const salawatButton =
  document.getElementById('salawatButton');

const calendarButton =
  document.getElementById('calendarButton');


const calendarModal =
  document.getElementById('calendarModal');

const closeModal =
  document.getElementById('closeModal');

const gCalLink =
  document.getElementById('gCalLink');

const icsLink =
  document.getElementById('icsLink');


let toastTimer;


/* =========================
   رسالة التنبيه
========================= */

function toastMsg(message){

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.classList.add('show');

  toastTimer = setTimeout(() => {

    toast.classList.remove('show');

  },2700);
}


/* =========================
   نسخ النص
========================= */

async function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(text);

    return true;
  }


  const textarea =
    document.createElement('textarea');

  textarea.value = text;

  textarea.style.position = 'fixed';

  textarea.style.left = '-9999px';

  document.body.appendChild(textarea);

  textarea.focus();

  textarea.select();


  const success =
    document.execCommand('copy');


  textarea.remove();


  if(!success){

    throw new Error('Copy failed');

  }

  return true;
}


/* =========================
   بيانات المناسبة
========================= */

const EVENT_DATA = {

  title:
    "حفل زفاف محمد المصطفى (منا) وسارة",

  details:
    "حضور عقد قران وحفل زفاف محمد المصطفى وسارة - قاعة جولدن هولز بوابة 1 نادي السكة الحديد",

  location:
    "قاعة جولدن هولز، بوابة 1، نادي السكة الحديد، مدينة نصر، القاهرة",

  /*
    16 سبتمبر 2026

    التوقيت الصيفي في مصر GMT+3

    7:00 مساءً محلياً = 16:00 UTC
    11:00 مساءً محلياً = 20:00 UTC
  */

  startUtc:
    "20260916T160000Z",

  endUtc:
    "20260916T200000Z"
};


/* =========================
   فتح خيارات التقويم
========================= */

calendarButton.addEventListener(
  'click',
  () => {

    const gCalUrl =
      `https://calendar.google.com/calendar/render?action=TEMPLATE` +
      `&text=${encodeURIComponent(EVENT_DATA.title)}` +
      `&dates=${EVENT_DATA.startUtc}/${EVENT_DATA.endUtc}` +
      `&details=${encodeURIComponent(EVENT_DATA.details)}` +
      `&location=${encodeURIComponent(EVENT_DATA.location)}`;


    gCalLink.href = gCalUrl;


    calendarModal.classList.add('show');


    calendarModal.setAttribute(
      'aria-hidden',
      'false'
    );

  }
);


/* =========================
   إغلاق نافذة التقويم
========================= */

closeModal.addEventListener(
  'click',
  () => {

    calendarModal.classList.remove('show');

    calendarModal.setAttribute(
      'aria-hidden',
      'true'
    );

  }
);


/* إغلاق النافذة بالضغط خارجها */

calendarModal.addEventListener(
  'click',
  (e) => {

    if(e.target === calendarModal){

      calendarModal.classList.remove('show');

      calendarModal.setAttribute(
        'aria-hidden',
        'true'
      );

    }

  }
);


/* =========================
   تنزيل ملف التقويم
========================= */

icsLink.addEventListener(
  'click',
  () => {

    const icsData =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Wedding Invitation//AR
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
SUMMARY:${EVENT_DATA.title}
DESCRIPTION:${EVENT_DATA.details}
LOCATION:${EVENT_DATA.location}
DTSTART:${EVENT_DATA.startUtc}
DTEND:${EVENT_DATA.endUtc}
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;


    const blob =
      new Blob(
        [icsData],
        {
          type:
            'text/calendar;charset=utf-8'
        }
      );


    const link =
      document.createElement('a');


    link.href =
      window.URL.createObjectURL(blob);


    link.setAttribute(
      'download',
      'wedding-event.ics'
    );


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    calendarModal.classList.remove('show');

    calendarModal.setAttribute(
      'aria-hidden',
      'true'
    );


    toastMsg(
      'تم تنزيل ملف التقويم'
    );

  }
);


/* =========================
   مشاركة الدعوة
========================= */

shareButton.addEventListener(
  'click',
  async () => {

    if(navigator.share){

      try{

        await navigator.share({
          url: SITE_URL
        });

        return;

      }catch(error){

        if(
          error.name === 'AbortError'
        ){

          return;

        }

      }

    }


    try{

      await copyText(SITE_URL);

      toastMsg(
        'تم نسخ رابط الدعوة'
      );

    }catch(error){

      toastMsg(
        'تعذر نسخ الرابط'
      );

    }

  }
);


/* =========================
   الصلاة على النبي
========================= */

salawatButton.addEventListener(
  'click',
  async () => {

    const text =
      'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ';


    try{

      await copyText(text);

    }catch(error){}


    toastMsg(text);

  }
);

</script>

</body>
</html>

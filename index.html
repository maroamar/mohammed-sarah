<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة زواج - منا وسارة</title>
    <style>
        /* ==========================================
           1. توحيد الألوان والتنسيق العام (Theme Setup)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f4efe6; /* لون خلفية موحد دافئ يناسب التصميم الذهبي */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        /* ==========================================
           2. حاوية الكرت والحماية من المشاكل (Card Frame)
           ========================================== */
        .main-wrapper {
            width: 100%;
            max-width: 480px; /* الحجم المثالي لأجهزة الموبايل */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card-container {
            width: 100%;
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(184, 134, 11, 0.15), 0 4px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
        }

        .card-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }

        /* ==========================================
           3. الأزرار التفاعلية الاحترافية (Interactive Actions)
           ========================================== */
        .actions-container {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #c5a059 0%, #9e7d3b 100%);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b38f48 0%, #8a6c2f 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(197, 160, 89, 0.4);
        }

        .btn-secondary {
            background: #ffffff;
            color: #8b6b23;
            border: 1px solid #c5a059;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn-secondary:hover {
            background: #fdfbf7;
            color: #6b5118;
        }

        /* ==========================================
           4. تحسينات التلاؤم مع الشاشات (Responsiveness)
           ========================================== */
        @media (max-width: 360px) {
            body {
                padding: 10px 5px;
            }
            .btn {
                font-size: 13px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="card-container">
            <img src="card_bg.png" alt="دعوة زواج منا وسارة" class="card-image">
        </div>

        <div class="actions-container">
            <a href="card_bg.png" download="دعوة_زواج_منا_وسارة.png" class="btn">
                💾 حفظ الدعوة
            </a>
            <button onclick="shareInvitation()" class="btn btn-secondary">
                📲 مشاركة
            </button>
        </div>
    </div>

    <script>
        // دالة المشاركة الذكية للرابط عبر الهاتف
        function shareInvitation() {
            if (navigator.share) {
                navigator.share({
                    title: 'دعوة زواج - منا وسارة',
                    text: 'يتشرف آل الحبوب وآل المساعد الزين بدعوتكم لحضور حفل زواج نجليهما',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الدعوة بنجاح!');
            }
        }
    </script>
</body>
</html>

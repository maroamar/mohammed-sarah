<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="دعوة زواج محمد المصطفى (منا) وسارة - الأربعاء 16 سبتمبر 2026م">
<meta property="og:title" content="دعوة زواج | محمد المصطفى (منا) وسارة">
<meta property="og:description" content="نتشرف بدعوتكم لحضور حفل زفاف محمد المصطفى (منا) وسارة">
<meta property="og:image" content="https://mohammed-sarah.vercel.app/invitation.png">
<meta property="og:url" content="https://mohammed-sarah.vercel.app/">
<meta property="og:type" content="website">
<title>دعوة زواج | محمد المصطفى (منا) وسارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

<style>
:root{
  --bg:#f7f3eb;--paper:#fffdf9;--gold:#b18a3d;--dark:#2c2420;
  --muted:#766e67;--border:rgba(177,138,61,.22);
  --shadow:0 18px 50px rgba(44,36,32,.13);
  --ease:cubic-bezier(.22,.61,.36,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100vh;padding:18px 14px 28px;overflow-x:hidden;color:var(--dark);
  font-family:"Cairo",sans-serif;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 0,rgba(255,255,255,.95),transparent 55%),var(--bg)
}
.top-label{margin-bottom:11px;color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.3px}
.book-wrapper{width:min(94vw,400px);aspect-ratio:642/1013;position:relative;perspective:1800px;margin-bottom:16px}
.book{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.page{
  position:absolute;inset:0;overflow:hidden;border:1px solid var(--border);border-radius:14px;
  background:var(--paper);box-shadow:var(--shadow);transform-origin:right center;
  transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .72s var(--ease);cursor:pointer;touch-action:manipulation;
  user-select:none;-webkit-user-select:none
}
.page.flipped{transform:rotateY(-180deg)}
.page:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.cover{display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,#fffefb 0,#f8f3e8 100%)}
.cover-inner{width:100%;height:100%;padding:38px 25px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.bismillah{font-family:"Aref Ruqaa",serif;font-size:18px;color:var(--gold)}
.cover-caption{margin-bottom:7px;color:var(--muted);font-size:13px;font-weight:500}
.names{font-family:"Aref Ruqaa",serif;font-size:clamp(34px,9vw,46px);line-height:1.16;color:var(--dark)}
.names .and{display:block;margin:5px 0;color:var(--gold);font-size:27px}
.cover-date{margin-bottom:13px;color:var(--muted);font-size:12px}
.open-hint{display:inline-flex;align-items:center;justify-content:center;min-width:155px;padding:9px 20px;border:1px solid var(--gold);border-radius:999px;background:rgba(255,255,255,.7);color:var(--gold);font-size:12px;font-weight:600}

.invitation{background:#f8f4e9;display:flex;align-items:center;justify-content:center;padding:0}
.invitation img{width:100%;height:100%;display:block;object-fit:contain;background:#f8f4e9}

.photo{background:#eee7da;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;display:block;object-fit:cover}
.photo-overlay{position:absolute;right:0;bottom:0;width:100%;padding:55px 18px 23px;text-align:center;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);pointer-events:none}
.photo-message{font-family:"Aref Ruqaa",serif;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.35)}

.actions{width:min(94vw,400px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.action{
  min-height:45px;padding:7px 5px;border:1px solid var(--border);border-radius:10px;
  background:rgba(255,255,255,.84);color:var(--dark);font-family:"Cairo",sans-serif;
  font-size:10.5px;font-weight:600;text-decoration:none;text-align:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(44,36,32,.05);transition:transform .2s,border-color .2s,background .2s,color .2s
}
.action:hover,.action:focus-visible{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);outline:none}
.action.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.action.primary:hover,.action.primary:focus-visible{background:var(--gold);border-color:var(--gold);color:#fff}

.share-panel{
  position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;
  padding:15px;background:rgba(44,36,32,.30);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)
}
.share-panel.open{display:flex}
.share-card{
  width:min(100%,400px);padding:22px 18px 17px;border:1px solid var(--border);
  border-radius:22px;background:#fffdf9;box-shadow:0 20px 60px rgba(0,0,0,.18);
  text-align:center;animation:shareUp .25s ease both
}
@keyframes shareUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
.share-title{margin-bottom:4px;font-family:"Aref Ruqaa",serif;font-size:23px;color:var(--dark)}
.share-description{margin-bottom:15px;color:var(--muted);font-size:11px;line-height:1.8}
.qr-box{width:150px;height:150px;margin:0 auto 13px;padding:10px;border:1px solid var(--border);border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center}
#qrcode{width:128px;height:128px;display:flex;align-items:center;justify-content:center}
#qrcode img,#qrcode canvas{max-width:128px;max-height:128px}
.qr-caption{margin-bottom:13px;color:var(--muted);font-size:10px}
.share-url{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:#faf7f0;color:var(--dark);font-family:"Cairo",sans-serif;font-size:10px;text-align:center;direction:ltr;outline:none}
.share-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.share-option{min-height:44px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--dark);font-family:"Cairo",sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.share-option.main{border-color:var(--dark);background:var(--dark);color:#fff}
.close-share{margin-top:10px;border:0;background:transparent;color:var(--muted);font-family:"Cairo",sans-serif;font-size:11px;cursor:pointer}
.toast{
  position:fixed;left:50%;bottom:25px;z-index:999;max-width:calc(100vw - 30px);
  padding:10px 17px;border-radius:999px;background:rgba(44,36,32,.95);color:#fff;
  font-size:11px;font-weight:600;text-align:center;opacity:0;pointer-events:none;
  transform:translate(-50%,18px);transition:opacity .25s,transform .25s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:480px){
  body{padding:12px 10px 22px}
  .top-label{margin-bottom:9px}
  .book-wrapper{width:min(95vw,380px)}
  .cover-inner{padding:32px 21px}
  .actions{width:min(95vw,380px)}
  .action{font-size:10px}
}
@media(max-height:700px){
  .book-wrapper{width:min(82vw,360px)}
  body{padding-top:7px;padding-bottom:12px}
}
@media(prefers-reduced-motion:reduce){
  .page,.action,.toast{transition:none}
  .share-card{animation:none}
}
</style>
</head>

<body>

<div class="top-label">دعوة زواج</div>

<main class="book-wrapper" aria-label="دعوة زواج تفاعلية">
  <div class="book" id="book">

    <section class="page cover" id="page1" role="button" tabindex="0" aria-label="غلاف الدعوة">
      <div class="cover-inner">
        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div>
          <div class="cover-caption">دعوة زواج</div>
          <h1 class="names">
            محمد المصطفى (منا)
            <span class="and">&amp;</span>
            سارة
          </h1>
        </div>
        <div>
          <p class="cover-date">الأربعاء، 16 سبتمبر 2026م</p>
          <span class="open-hint">اضغط لفتح الدعوة</span>
        </div>
      </div>
    </section>

    <section class="page invitation" id="page2" role="button" tabindex="0" aria-label="الدعوة الرسمية">
      <img src="invitation.png" alt="دعوة زواج محمد المصطفى (منا) وسارة" loading="eager" decoding="async">
    </section>

    <section class="page photo" id="page3" role="button" tabindex="0" aria-label="صورة العروسين">
      <img src="04_bridegroom.png" alt="صورة العروسين محمد المصطفى (منا) وسارة" loading="lazy" decoding="async">
      <div class="photo-overlay">
        <div class="photo-message">بارك الله لهما وجمع بينهما في خير</div>
      </div>
    </section>

  </div>
</main>

<nav class="actions" aria-label="خيارات الدعوة">
  <a class="action primary"
     href="https://www.google.com/maps/search/?api=1&query=قاعة+جولدن+هولز+نادي+السكة+مدينة+نصر"
     target="_blank" rel="noopener noreferrer">فتح الموقع</a>

  <button type="button" class="action" id="shareButton">مشاركة الدعوة</button>

  <button type="button" class="action" id="salawatButton">صلِّ على سيدنا محمد ﷺ</button>
</nav>

<div class="share-panel" id="sharePanel" aria-hidden="true">
  <div class="share-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h2 class="share-title" id="shareTitle">شارك فرحتنا</h2>
    <p class="share-description">أرسل الدعوة لمن تحب، وسيصلهم الرابط مباشرة إلى الدعوة.</p>

    <div class="qr-box"><div id="qrcode"></div></div>
    <div class="qr-caption">امسح الرمز لفتح الدعوة</div>

    <input class="share-url" id="shareUrl" type="text" readonly
           value="https://mohammed-sarah.vercel.app/" aria-label="رابط الدعوة">

    <div class="share-options">
      <button type="button" class="share-option main" id="nativeShare">مشاركة مباشرة</button>
      <button type="button" class="share-option" id="copyLink">نسخ الرابط</button>
    </div>

    <button type="button" class="close-share" id="closeShare">إغلاق</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SITE_URL = "https://mohammed-sarah.vercel.app/";

const pages = [
  document.getElementById("page1"),
  document.getElementById("page2"),
  document.getElementById("page3")
];

let currentPage = 0;

function updateBook() {
  pages.forEach((page, index) => {
    const flipped = index < currentPage;
    page.classList.toggle("flipped", flipped);
    page.style.zIndex = flipped
      ? String(index + 1)
      : String(pages.length - index + 3);
  });
}

function nextPage() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    updateBook();
  }
}

function previousPage() {
  if (currentPage > 0) {
    currentPage--;
    updateBook();
  }
}

/* النصف الأيمن: للأمام — النصف الأيسر: للخلف */
pages.forEach(page => {
  page.addEventListener("click", event => {
    const rect = page.getBoundingClientRect();
    const x = event.clientX - rect.left;
    x > rect.width / 2 ? nextPage() : previousPage();
  });

  page.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      nextPage();
    }
    if (event.key === "ArrowLeft") nextPage();
    if (event.key === "ArrowRight") previousPage();
  });
});

/* Swipe */
const book = document.getElementById("book");
let touchStartX = null;

book.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].clientX;
}, {passive:true});

book.addEventListener("touchend", event => {
  if (touchStartX === null) return;
  const touchEndX = event.changedTouches[0].clientX;
  const delta = touchEndX - touchStartX;

  if (Math.abs(delta) > 45) {
    delta < 0 ? nextPage() : previousPage();
  }
  touchStartX = null;
}, {passive:true});

/* Sharing */
const shareButton = document.getElementById("shareButton");
const sharePanel = document.getElementById("sharePanel");
const nativeShare = document.getElementById("nativeShare");
const copyLink = document.getElementById("copyLink");
const closeShare = document.getElementById("closeShare");

const shareData = {
  title: "دعوة زواج | محمد المصطفى (منا) وسارة",
  text:
    "نتشرف بدعوتكم لحضور حفل زفاف محمد المصطفى (منا) وسارة\n" +
    "الأربعاء 16 سبتمبر 2026م\n" +
    "قاعة جولدن هولز — نادي السكة — مدينة نصر",
  url: SITE_URL
};

function createQRCode() {
  const qr = document.getElementById("qrcode");
  if (!qr || typeof QRCode === "undefined") return;
  qr.innerHTML = "";
  new QRCode(qr, {
    text: SITE_URL,
    width: 128,
    height: 128,
    correctLevel: QRCode.CorrectLevel.H
  });
}

function openSharePanel() {
  sharePanel.classList.add("open");
  sharePanel.setAttribute("aria-hidden", "false");
  createQRCode();
}

function closeSharePanel() {
  sharePanel.classList.remove("open");
  sharePanel.setAttribute("aria-hidden", "true");
}

shareButton.addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (error) {}
  } else {
    openSharePanel();
  }
});

nativeShare.addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (error) {}
  } else {
    copyInvitationLink();
  }
});

copyLink.addEventListener("click", copyInvitationLink);

async function copyInvitationLink() {
  try {
    await navigator.clipboard.writeText(SITE_URL);
    showToast("تم نسخ رابط الدعوة");
    closeSharePanel();
  } catch (error) {
    const input = document.getElementById("shareUrl");
    input.focus();
    input.select();
    document.execCommand("copy");
    showToast("تم نسخ رابط الدعوة");
  }
}

closeShare.addEventListener("click", closeSharePanel);

sharePanel.addEventListener("click", event => {
  if (event.target === sharePanel) closeSharePanel();
});

/* Salawat */
document.getElementById("salawatButton").addEventListener("click", async () => {
  const salawat = "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ";
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(salawat);
  } catch (error) {}
  showToast(salawat);
});

/* Toast */
const toast = document.getElementById("toast");
let toastTimer;

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSharePanel();
});

updateBook();
</script>

</body>
</html>
